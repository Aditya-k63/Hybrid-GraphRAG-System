name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -v --ignore=tests/test_benchmark.py

  benchmark:
    needs: build-check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: graphrag
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/password
        ports:
          - 7687:7687
        options: >-
          --health-cmd "neo4j status"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Initialize database
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: graphrag
          DB_USER: postgres
          DB_PASSWORD: postgres
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          API_KEY: test-key
        run: |
          python -c "
          import psycopg2
          conn = psycopg2.connect(host='localhost', dbname='graphrag', user='postgres', password='postgres')
          cur = conn.cursor()
          cur.execute('CREATE EXTENSION IF NOT EXISTS vector')
          cur.execute('''CREATE TABLE IF NOT EXISTS document_sections (
              id BIGSERIAL PRIMARY KEY, content TEXT NOT NULL,
              meta JSONB, embedding VECTOR(384))''')
          cur.execute('''CREATE TABLE IF NOT EXISTS search_analytics (
              id BIGSERIAL PRIMARY KEY, question TEXT, retrieval_type VARCHAR(20),
              chunks_used INT, latency_ms FLOAT, created_at TIMESTAMP DEFAULT NOW())''')
          conn.commit()
          cur.close()
          conn.close()
          print('Database initialized')
          "
      - name: Seed test documents
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: graphrag
          DB_USER: postgres
          DB_PASSWORD: postgres
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password
        run: |
          python scripts/seed_benchmark_data.py
      - name: Start API server
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > server.log 2>&1 &
          sleep 15
          curl -s http://localhost:8000/health || echo "Server not ready yet"
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: graphrag
          DB_USER: postgres
          DB_PASSWORD: postgres
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: password
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          API_KEY: test-key
          RATE_LIMIT_REQUESTS: "9999"
      - name: Run benchmark (regression check)
        env:
          BASE_URL: http://localhost:8000
          API_KEY: test-key
        run: python -m pytest tests/test_benchmark.py -v --tb=short -x
      - name: Dump server logs
        if: always()
        run: |
          echo "=== SERVER LOGS ==="
          cat server.log || true
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
          retention-days: 30

  docker-push:
    needs: [build-check, benchmark]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Build and push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/graphrag:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/graphrag:latest

  update-baseline:
    needs: [benchmark, docker-push]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
      - name: Update baseline
        run: |
          python -c "
          import json
          from datetime import datetime

          with open('benchmark_results.json') as f:
              results = json.load(f)

          baseline = {
              'version': 1,
              'last_updated': datetime.utcnow().strftime('%Y-%m-%d'),
              'commit_sha': '${{ github.sha }}',
              'metrics': results['metrics'],
              'per_question': results.get('per_question', []),
              'notes': 'Auto-updated after successful deploy'
          }

          with open('benchmark_baseline.json', 'w') as f:
              json.dump(baseline, f, indent=2)

          print('Baseline updated:')
          print(json.dumps(baseline['metrics'], indent=2))
          "
      - name: Commit baseline update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add benchmark_baseline.json
          git diff --cached --quiet || git commit -m "chore: update benchmark baseline [skip ci]"
          git push
